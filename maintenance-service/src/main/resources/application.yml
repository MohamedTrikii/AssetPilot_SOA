spring:
  application:
    name: maintenance-service

  # Base propre au service : H2 en mémoire en local et en test, PostgreSQL (maintenancedb) en Docker.
  # Le driver est déduit de l'URL JDBC.
  datasource:
    url: ${MAINTENANCE_DB_URL:jdbc:h2:mem:maintenancedb;DB_CLOSE_DELAY=-1}
    username: ${MAINTENANCE_DB_USERNAME:sa}
    password: ${MAINTENANCE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${MAINTENANCE_DB_POOL_SIZE:10}

  # Schéma versionné par Flyway (db/migration) ; Hibernate vérifie seulement la cohérence des entités
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Port HTTP d'administration (Actuator / healthcheck uniquement)
server:
  port: ${SERVER_PORT:8084}

grpc:
  server:
    port: ${GRPC_PORT:9090}
    # Réflexion activée pour grpcurl / Postman
    reflection-service-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.assetpilot.maintenance: INFO
