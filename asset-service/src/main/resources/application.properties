
# Nom et port du service
spring.application.name=asset-service
server.port=8081

# Base H2 en mémoire pour le développement local
spring.datasource.url=jdbc:h2:mem:assetdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Création et évolution des tables pendant le développement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Endpoints de supervision exposés
management.endpoints.web.exposure.include=health,info