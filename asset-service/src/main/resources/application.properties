
# Nom et port du service
spring.application.name=asset-service
server.port=${SERVER_PORT:8081}

# Base H2 propre au service (en mémoire par défaut, fichier en Docker via ASSET_DB_URL)
spring.datasource.url=${ASSET_DB_URL:jdbc:h2:mem:assetdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Création et évolution des tables pendant le développement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Ce service est uniquement CLIENT SOAP : pas de MessageDispatcherServlet
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.webservices.WebServicesAutoConfiguration

# Documentation OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/v1/**

# Endpoints de supervision exposés
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------
# Appels inter-services
# ---------------------------------------------------------------

# Warranty Service (SOAP)
assetpilot.warranty.url=${WARRANTY_SERVICE_URL:http://localhost:8082/ws}
assetpilot.warranty.connect-timeout=2s
assetpilot.warranty.read-timeout=3s

# Maintenance Service (gRPC)
grpc.client.maintenance.address=${MAINTENANCE_GRPC_ADDRESS:static://localhost:9090}
grpc.client.maintenance.negotiation-type=plaintext
assetpilot.maintenance.deadline=3s
assetpilot.maintenance.stream-deadline=10m

# Jeu de données de démonstration
assetpilot.seed-data=${SEED_DATA:true}

# Derrière l'API Gateway : prise en compte des en-têtes X-Forwarded-* (liens Swagger, Location)
server.forward-headers-strategy=framework
assetpilot.gateway-url=${GATEWAY_PUBLIC_URL:http://localhost:8083}
