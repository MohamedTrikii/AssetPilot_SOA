server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: warranty-service

  datasource:
    url: ${WARRANTY_DB_URL:jdbc:h2:mem:warrantydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${WARRANTY_DDL_AUTO:create-drop}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.assetpilot.warranty: DEBUG
    org.springframework.ws: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
