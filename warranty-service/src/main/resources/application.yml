server:
  port: 8082

spring:
  application:
    name: warranty-service

  datasource:
    url: jdbc:h2:mem:warrantydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.assetpilot.warranty: DEBUG
    org.springframework.ws: INFO
