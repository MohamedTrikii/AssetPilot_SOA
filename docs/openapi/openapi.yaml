openapi: 3.0.1
info:
  title: AssetPilot — Asset Service API
  description: |-
    Gestion du parc informatique : équipements, employés et affectations.
    Les endpoints de garantie et de maintenance appellent le Warranty Service (SOAP)
    et le Maintenance Service (gRPC).
  contact:
    name: Équipe AssetPilot — 3 GLID G1
  version: v1
servers:
- url: http://localhost:8083
  description: Via l'API Gateway
- url: http://localhost:8081
  description: Asset Service en direct
tags:
- name: Assignments
  description: Affectation des équipements aux employés
- name: Employees
  description: Gestion des employés
- name: Maintenance
  description: Interventions de maintenance (relayées vers le Maintenance Service
    en gRPC)
- name: Equipments
  description: Gestion des équipements du parc informatique
paths:
  /api/v1/equipments/{id}:
    get:
      tags:
      - Equipments
      summary: Consulter un équipement
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
    put:
      tags:
      - Equipments
      summary: Mettre à jour un équipement
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
    delete:
      tags:
      - Equipments
      summary: Supprimer un équipement (sans historique d'affectation)
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/v1/employees/{id}:
    get:
      tags:
      - Employees
      summary: Consulter un employé
      operationId: get_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
    put:
      tags:
      - Employees
      summary: Mettre à jour un employé
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
    delete:
      tags:
      - Employees
      summary: Supprimer un employé (sans affectation)
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/v1/maintenance-requests/{requestId}/interventions:
    post:
      tags:
      - Maintenance
      summary: Planifier une intervention pour une demande existante (gRPC ScheduleIntervention)
      operationId: schedule
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInterventionRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InterventionInfo"
  /api/v1/equipments:
    get:
      tags:
      - Equipments
      summary: "Lister les équipements (filtres optionnels : statut, type)"
      operationId: list
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - AVAILABLE
          - ASSIGNED
          - IN_MAINTENANCE
          - RETIRED
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - LAPTOP
          - DESKTOP
          - MONITOR
          - PRINTER
          - SERVER
          - PHONE
          - TABLET
          - NETWORK
          - OTHER
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquipmentResponse"
    post:
      tags:
      - Equipments
      summary: Créer un équipement
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
  /api/v1/equipments/{id}/maintenance-requests:
    post:
      tags:
      - Equipments
      summary: "Déclarer une panne : vérifie la garantie (SOAP) puis crée/planifie\
        \ l'intervention (gRPC)"
      operationId: openMaintenance
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaintenanceRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MaintenanceTicket"
  /api/v1/employees:
    get:
      tags:
      - Employees
      summary: Lister les employés
      operationId: list_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeResponse"
    post:
      tags:
      - Employees
      summary: Créer un employé
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
  /api/v1/assignments:
    get:
      tags:
      - Assignments
      summary: "Lister les affectations (filtres optionnels : employé, équipement,\
        \ statut)"
      operationId: list_2
      parameters:
      - name: employeeId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: equipmentId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - RETURNED
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignmentResponse"
    post:
      tags:
      - Assignments
      summary: Affecter un équipement disponible à un employé
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
  /api/v1/interventions/{interventionId}/status:
    patch:
      tags:
      - Maintenance
      summary: Faire évoluer le statut d'une intervention (gRPC UpdateInterventionStatus)
      operationId: updateStatus
      parameters:
      - name: interventionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInterventionStatusRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InterventionInfo"
  /api/v1/assignments/{id}/return:
    patch:
      tags:
      - Assignments
      summary: Restituer l'équipement (clôture de l'affectation)
      operationId: returnEquipment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnAssignmentRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
  /api/v1/interventions/{interventionId}:
    get:
      tags:
      - Maintenance
      summary: Consulter une intervention (gRPC GetIntervention)
      operationId: get
      parameters:
      - name: interventionId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InterventionInfo"
  /api/v1/interventions/{interventionId}/status-stream:
    get:
      tags:
      - Maintenance
      summary: Suivre les changements de statut en temps réel (gRPC streaming → SSE)
      operationId: track
      parameters:
      - name: interventionId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
  /api/v1/equipments/{id}/warranty:
    get:
      tags:
      - Equipments
      summary: Vérifier la garantie (Warranty Service — SOAP CheckWarranty)
      operationId: checkWarranty
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WarrantyCoverage"
  /api/v1/equipments/{id}/warranty/details:
    get:
      tags:
      - Equipments
      summary: Détails du contrat de garantie (Warranty Service — SOAP GetWarrantyDetails)
      operationId: warrantyDetails
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WarrantyDetails"
  /api/v1/assignments/{id}:
    get:
      tags:
      - Assignments
      summary: Consulter une affectation
      operationId: get_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
    delete:
      tags:
      - Assignments
      summary: Supprimer une affectation clôturée
      operationId: delete_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
components:
  schemas:
    EquipmentRequest:
      required:
      - assetTag
      - name
      - serialNumber
      - type
      type: object
      properties:
        assetTag:
          maxLength: 64
          minLength: 0
          pattern: "^[A-Za-z0-9-_]+$"
          type: string
          description: Identifiant d'inventaire partagé avec Maintenance et Warranty
          example: AST-010
        name:
          maxLength: 120
          minLength: 0
          type: string
          example: Laptop Dell Latitude 5440
        type:
          type: string
          example: LAPTOP
          enum:
          - LAPTOP
          - DESKTOP
          - MONITOR
          - PRINTER
          - SERVER
          - PHONE
          - TABLET
          - NETWORK
          - OTHER
        brand:
          maxLength: 60
          minLength: 0
          type: string
          example: Dell
        model:
          maxLength: 60
          minLength: 0
          type: string
          example: Latitude 5440
        serialNumber:
          maxLength: 80
          minLength: 0
          type: string
          example: SN-DL-5440-010
        purchaseDate:
          type: string
          format: date
          example: 2025-01-15
        status:
          type: string
          description: "Optionnel en mise à jour : seuls AVAILABLE et RETIRED peuvent\
            \ être positionnés manuellement"
          enum:
          - AVAILABLE
          - ASSIGNED
          - IN_MAINTENANCE
          - RETIRED
      description: Création ou mise à jour d'un équipement
    EquipmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        assetTag:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - LAPTOP
          - DESKTOP
          - MONITOR
          - PRINTER
          - SERVER
          - PHONE
          - TABLET
          - NETWORK
          - OTHER
        brand:
          type: string
        model:
          type: string
        serialNumber:
          type: string
        purchaseDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - AVAILABLE
          - ASSIGNED
          - IN_MAINTENANCE
          - RETIRED
    EmployeeRequest:
      required:
      - email
      - firstName
      - lastName
      type: object
      properties:
        firstName:
          maxLength: 60
          minLength: 0
          type: string
          example: Sarra
        lastName:
          maxLength: 60
          minLength: 0
          type: string
          example: Ben Salah
        email:
          maxLength: 120
          minLength: 0
          type: string
          example: sarra.bensalah@assetpilot.tn
        department:
          maxLength: 80
          minLength: 0
          type: string
          example: Finance
        jobTitle:
          maxLength: 80
          minLength: 0
          type: string
          example: Comptable
    EmployeeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        department:
          type: string
        jobTitle:
          type: string
    ScheduleInterventionRequest:
      required:
      - scheduledAt
      type: object
      properties:
        scheduledAt:
          type: string
          format: date-time
          example: 2026-12-01T09:00:00Z
    InterventionInfo:
      type: object
      properties:
        id:
          type: string
        maintenanceRequestId:
          type: string
        assetTag:
          type: string
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - SCHEDULED
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
    CreateMaintenanceRequest:
      required:
      - description
      type: object
      properties:
        description:
          maxLength: 1000
          minLength: 0
          type: string
          example: L'écran clignote au démarrage
        scheduledAt:
          type: string
          description: "Optionnel : planifie directement l'intervention"
          format: date-time
          example: 2026-12-01T09:00:00Z
    MaintenanceRequestInfo:
      type: object
      properties:
        id:
          type: string
        assetTag:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
    MaintenanceTicket:
      type: object
      properties:
        equipmentId:
          type: integer
          format: int64
        assetTag:
          type: string
        warranty:
          $ref: "#/components/schemas/WarrantyCoverage"
        maintenanceRequest:
          $ref: "#/components/schemas/MaintenanceRequestInfo"
        intervention:
          $ref: "#/components/schemas/InterventionInfo"
      description: Résultat du flux Asset → Warranty (SOAP) → Maintenance (gRPC)
    WarrantyCoverage:
      type: object
      properties:
        assetTag:
          type: string
        covered:
          type: boolean
          description: true si une garantie active couvre l'équipement aujourd'hui
        status:
          type: string
          description: "ACTIVE, EXPIRED, VOIDED, PENDING, NOT_FOUND ou UNKNOWN"
          example: ACTIVE
        expiryDate:
          type: string
          format: date
        coverageType:
          type: string
        message:
          type: string
        verified:
          type: boolean
          description: false si le Warranty Service n'a pas pu répondre (valeur de
            repli)
      description: "Résultat de CheckWarranty (Warranty Service, SOAP)"
    AssignmentRequest:
      required:
      - employeeId
      - equipmentId
      type: object
      properties:
        equipmentId:
          type: integer
          format: int64
          example: 2
        employeeId:
          type: integer
          format: int64
          example: 1
        assignedAt:
          type: string
          description: "Par défaut : aujourd'hui"
          format: date
          example: 2026-11-19
        notes:
          maxLength: 500
          minLength: 0
          type: string
          example: Poste de travail principal
    AssignmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        equipmentId:
          type: integer
          format: int64
        assetTag:
          type: string
        employeeId:
          type: integer
          format: int64
        employeeName:
          type: string
        assignedAt:
          type: string
          format: date
        returnedAt:
          type: string
          format: date
        status:
          type: string
          enum:
          - ACTIVE
          - RETURNED
        notes:
          type: string
    UpdateInterventionStatusRequest:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          example: IN_PROGRESS
          enum:
          - SCHEDULED
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
    ReturnAssignmentRequest:
      type: object
      properties:
        returnedAt:
          type: string
          description: "Par défaut : aujourd'hui"
          format: date
          example: 2026-12-01
        notes:
          maxLength: 500
          minLength: 0
          type: string
    SseEmitter:
      type: object
      properties:
        timeout:
          type: integer
          format: int64
    WarrantyDetails:
      type: object
      properties:
        id:
          type: string
        assetTag:
          type: string
        contractNumber:
          type: string
        provider:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
        coverageType:
          type: string
        slaLevel:
          type: string
        terms:
          type: string
        supportContact:
          type: string
      description: "Résultat de GetWarrantyDetails (Warranty Service, SOAP)"
